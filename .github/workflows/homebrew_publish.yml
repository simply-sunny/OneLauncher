name: Update Homebrew Cask

on:
  release:
    types: [published]
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homebrew-cask-update
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'Polyfrost/OneLauncher'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Update version and checksums from the latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest")
          version=$(jq -er '.tag_name | capture("^oneclient-(?<version>[0-9]+\\.[0-9]+\\.[0-9]+)$").version' <<< "$release")

          digest() {
            jq -er --arg name "OneClient_${version}_$1.dmg" '
              .assets[] | select(.name == $name and .state == "uploaded")
              | .digest | strings | capture("^sha256:(?<hash>[a-f0-9]{64})$").hash
            ' <<< "$release"
          }

          arm_sha=$(digest aarch64)
          intel_sha=$(digest x64)
          sed -i -E \
            -e "s/^(  version )\"[^\"]+\"$/\1\"$version\"/" \
            -e "s/^(  sha256 arm: +)\"[a-f0-9]{64}\",$/\1\"$arm_sha\",/" \
            -e "s/^( +intel: +)\"[a-f0-9]{64}\"$/\1\"$intel_sha\"/" \
            Casks/oneclient.rb

          if git diff --quiet -- Casks/oneclient.rb; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/oneclient.rb
          git commit -m "oneclient: update Homebrew cask to $version"
          git push
