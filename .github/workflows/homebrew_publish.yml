name: Update Homebrew Cask

on:
  release:
    types: [published, edited]
  workflow_dispatch:

concurrency:
  group: homebrew-cask-update
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.repository == 'Polyfrost/OneLauncher' &&
      (github.event_name != 'release' ||
       (!github.event.release.prerelease && startsWith(github.event.release.tag_name, 'oneclient-')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Update version and checksums from the latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest")
          version=$(jq -er '.tag_name | capture("^oneclient-(?<version>[0-9]+\\.[0-9]+\\.[0-9]+)$").version' <<< "$release")
          if [[ -n "$EVENT_TAG" && "$EVENT_TAG" != "oneclient-$version" ]]; then
            echo "$EVENT_TAG is not marked Latest. Syncing the cask with oneclient-$version."
          fi

          digest() {
            jq -er --arg name "OneClient_${version}_$1.dmg" '
              .assets[] | select(.name == $name and .state == "uploaded")
              | .digest | strings | capture("^sha256:(?<hash>[a-f0-9]{64})$").hash
            ' <<< "$release" || {
              echo "::error::OneClient_${version}_$1.dmg is missing an uploaded SHA-256 digest." >&2
              return 1
            }
          }

          arm_sha=$(digest aarch64)
          intel_sha=$(digest x64)
          sed -i -E \
            -e "s/^(  version )\"[^\"]+\"$/\1\"$version\"/" \
            -e "s/^(  sha256 arm: +)\"[a-f0-9]{64}\",$/\1\"$arm_sha\",/" \
            -e "s/^( +intel: +)\"[a-f0-9]{64}\"$/\1\"$intel_sha\"/" \
            Casks/oneclient.rb

          grep -Fxq "  version \"$version\"" Casks/oneclient.rb
          grep -Fxq "  sha256 arm:   \"$arm_sha\"," Casks/oneclient.rb
          grep -Fxq "         intel: \"$intel_sha\"" Casks/oneclient.rb

          if git diff --quiet -- Casks/oneclient.rb; then
            echo "Homebrew cask already matches oneclient-$version."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/oneclient.rb
          git commit -m "oneclient: update Homebrew cask to $version"
          git push
